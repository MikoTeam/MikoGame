<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nova Game</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; background-color: #111; color: white; font-family: sans-serif; user-select: none; overflow: hidden;}
        
        /* LOBBY */
        #lobby { 
            width: 100vw; height: 100vh; 
            /* ⬇️ GANTI LINK DI BAWAH INI PAKAI LINK RAW DARI GITHUB LO ⬇️ */
            background: url('https://raw.githubusercontent.com/MikoTeam/MikoGame/main/assets/e305673ce9d3fb70bdb0aec463f390b.jpg') center/cover no-repeat; 
            background-color: #1a2a6c; /* Warna cadangan kalau gambar lemot */
            display: flex; flex-direction: column; justify-content: space-between; 
            padding: 20px; position: absolute; top:0; left:0; z-index: 10;
        }
        
        .top-bar { display: flex; justify-content: space-between; font-weight: bold; }
        .gold { background: rgba(0,0,0,0.7); padding: 5px 15px; border-radius: 20px; color: #f1c40f; border: 1px solid #f1c40f; }
        
        .center-content { display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; }
        
        .start-btn { 
            background: #e74c3c; border: 3px solid #fff; padding: 15px 40px; 
            color: white; font-size: 24px; border-radius: 10px; font-weight: 900; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); cursor: pointer; margin-top: 20px;
        }
        
        #game-container { display: none; width: 100vw; height: 100vh; position: absolute; top:0; left:0; z-index: 5; }

        /* Kontrol Game */
        #controls { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
        .dpad { position: absolute; bottom: 30px; left: 30px; display: grid; grid-template-columns: 50px 50px 50px; grid-template-rows: 50px 50px 50px; pointer-events: auto; }
        .dpad-btn { background: rgba(255,255,255,0.3); border: 2px solid rgba(255,255,255,0.5); border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 24px; color: white; }
        .dpad-up { grid-column: 2; grid-row: 1; } .dpad-left { grid-column: 1; grid-row: 2; }
        .dpad-right { grid-column: 3; grid-row: 2; } .dpad-down { grid-column: 2; grid-row: 3; }
        .shoot-btn-ui { position: absolute; bottom: 50px; right: 50px; width: 80px; height: 80px; background: rgba(231, 76, 60, 0.7); border: 3px solid #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; color: white; pointer-events: auto; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
    <!-- LOBBY -->
    <div id="lobby">
        <div class="top-bar">
            <div>👤 MikoPlayer</div>
            <div class="gold">🪙 <span id="gold-amount">1000</span></div>
        </div>
        
        <div class="center-content">
            <h1 style="font-size: 40px; text-shadow: 2px 2px #000; color: #f1c40f;">NOVA</h1>
            <button class="start-btn" onclick="startGame()">START</button>
        </div>
    </div>

    <!-- GAME -->
    <div id="game-container"></div>
    
    <!-- KONTROL -->
    <div id="controls">
        <div class="dpad">
            <div class="dpad-btn dpad-up" id="btn-up">▲</div>
            <div class="dpad-btn dpad-left" id="btn-left">◀</div>
            <div class="dpad-btn dpad-right" id="btn-right">▶</div>
            <div class="dpad-btn dpad-down" id="btn-down">▼</div>
        </div>
        <div class="shoot-btn-ui" id="btn-shoot">BANG</div>
    </div>

    <script src="game.js"></script>
</body>
</html>
